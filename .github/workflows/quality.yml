name: Qualitätsprüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }}
    strategy:
      matrix:
        php: ["8.3", "8.4", "8.5"]

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, fileinfo
          coverage: none

      - name: PHP-Syntax prüfen
        run: find www -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Linux-Installer prüfen
        run: bash -n Install/install_helferliste.sh

      - name: Datenbankschema prüfen
        run: sqlite3 /tmp/helferliste-test.sqlite < Install/database_schema.sql

      - name: Installation und Einstellungen prüfen
        run: php tests/smoke.php

      - name: Aktualisierung und Datenerhalt prüfen
        run: php tests/migration.php

      - name: Wiederherstellung prüfen
        run: php tests/restore.php

      - name: Veranstaltungsabschluss prüfen
        run: php tests/event_lifecycle.php

      - name: Zeitraum, Status und Schichtfelder prüfen
        run: php tests/scheduling.php

      - name: Geführte Ersteinrichtung prüfen
        run: php tests/setup_wizard.php

      - name: CSV-Kontaktimport prüfen
        run: php tests/contact_import.php

      - name: Schichtplan und Anwesenheitslisten prüfen
        run: php tests/print_lists.php

      - name: Einladungen und Erinnerungen prüfen
        run: php tests/invitations.php

      - name: Lokale QR-Erzeugung prüfen
        run: node --check www/assets/vendor/qrcodegen.js

      - name: Sichere Admin-Ersteinrichtung prüfen
        run: bash tests/http_admin_setup.sh
